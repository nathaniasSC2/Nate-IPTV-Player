<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="64" fill="url(#bgGrad)"/>

  <!-- TV Frame -->
  <rect x="80" y="96" width="352" height="240" rx="16" fill="#f8fafc"/>

  <!-- Screen -->
  <rect x="96" y="112" width="320" height="208" rx="8" fill="url(#screenGrad)"/>

  <!-- Play button on screen -->
  <polygon points="224,180 224,256 288,218" fill="#0ea5e9" opacity="0.9"/>

  <!-- TV Stand -->
  <rect x="200" y="352" width="112" height="16" rx="4" fill="#f8fafc"/>
  <rect x="176" y="368" width="160" height="24" rx="8" fill="#f8fafc"/>

  <!-- Signal waves -->
  <path d="M400,80 Q440,120 400,160" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M420,60 Q480,120 420,180" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Channel indicator dots -->
  <circle cx="120" cy="300" r="6" fill="#22c55e"/>
  <circle cx="144" cy="300" r="6" fill="#f59e0b"/>
  <circle cx="168" cy="300" r="6" fill="#ef4444"/>
</svg>
